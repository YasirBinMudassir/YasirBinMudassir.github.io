<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YASIR BIN MUDASSIR - VAULT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:20px}
.top{text-align:center;padding:20px 10px}
.top h1{color:#F6E8A6;font-size:32px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#1A1A1A;border:1px solid #C9A86A;border-radius:16px;padding:16px}
.card h3{color:#F6E8A6;margin:8px 0}
.card p{color:#aaa;font-size:13px}
.btn{background:#00FF88;color:#000;text-align:center;padding:10px;border-radius:10px;font-weight:bold;margin-top:10px;display:block;text-decoration:none}
.footer{text-align:center;color:#666;margin:30px 0;font-size:13px}
@media(max-width:500px){.grid{grid-template-columns:1fr}.top h1{font-size:26px}}

</head>
<body>
<div class="top">
<h1>YASIR BIN MUDASSIR</h1>
<p>@YasirBinMudassir</p>
<p style="color:#aaa;font-weight:normal">ALL PDFs • ONE PLACE • 24/7</p>
</div>

function copyBNB(){
